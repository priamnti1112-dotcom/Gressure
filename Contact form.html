<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact us form</title>
    <style>
       h2{
        text-align: center;
        background-color: dimgrey;
       }

       form{
        border: 2px solid black;
        padding: 20px;
        width: 400px;
        height: 300px;
       }

       
   
    </style>
</head>
<body>
    <form>
        <h2>CONTACT US</h2>
        <hr></hr>
        
        <label>Full Name:</label>
        <input style="margin-left: 30px;" placeholder="Enter your full name">
        <br><br>

        <label>Email:</label>
        <input style="margin-left:60px ;" placeholder="Enter your email">
        <br><br>

        <label>Subject:</label>
        <select style="margin-left: 55px;">
            <option>General Enquity</option>
        </select>
        <br><br>

        <label >Message:</label>
        <textarea style="margin-left: 40px;">Write your message here</textarea>
        <br><br>

        <button style="background-color: rgb(68, 184, 93);" style="border-color: rgb(68, 184, 93);">Send message</button>
        <button style="background-color: grey;" >Clear</button>
    </form>
</body>
</html>
